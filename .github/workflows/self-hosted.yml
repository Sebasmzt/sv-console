name: Self-hosted CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, litepod, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run check --if-present

      - name: Build package
        run: npm run build
